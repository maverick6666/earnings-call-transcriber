[project]
name = "earnings-call-transcriber"
version = "0.1.0"
description = "어닝콜 받아쓰기: 청크 경계 손실과 오인식을 줄이는 방법을 같은 평가 틀에서 숫자로 비교"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# 실제 받아쓰기(모델은 scripts/download_data.py models 로 내려받음). 평가는 faster-whisper 1.2.1 · CTranslate2 4.9 로 했다.
# PyAV 16 부터 faster-whisper 1.2.1 이 쓰는 open(metadata_errors=…) 가 없어져 15 이하로 묶는다.
# Windows 에서 CUDA 를 따로 깔지 않았다면 cuda 도 함께: pip install -e ".[asr,cuda]"
asr = ["faster-whisper==1.2.1", "av<16", "soundfile>=0.12", "pyarrow>=15"]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
# Qwen3-ASR(맥락을 넣는 음성 LLM). torch · transformers 가 무거워 별도 환경 권장(평가는 Python 3.12 · qwen-asr 0.0.6 ·
# torch 2.11 cu128 · transformers 4.57). CUDA 판 torch 는 먼저 PyTorch 안내대로 깐다. 모델은 처음 실행 때 Hugging Face 에서 받음.
qwen = ["qwen-asr==0.0.6", "librosa>=0.10"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
